# Spring Boot Configuration
spring.application.name=aptasks-backend
server.port=3000

spring.datasource.url=${SUPABASE_URL}
spring.datasource.username=${SUPABASE_USER}
spring.datasource.password=${SUPABASE_PASS}

supabase.url=${SUPABASE_API_URL}
supabase.key=${SUPABASE_KEY}

# Impede o Spring de tentar criar tabelas ou validar metadados (essencial!)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


# Aumenta a tolerância de espera
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10

# Garante que a conexão ainda é válida antes de usar
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.max-lifetime=1800000
