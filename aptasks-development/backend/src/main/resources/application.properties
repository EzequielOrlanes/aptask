# Spring Boot Configuration
spring.application.name=aptasks-backend
server.port=${PORT:3000}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/aptasks}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

supabase.url=${SUPABASE_API_URL}
supabase.key=${SUPABASE_KEY}

# Impede o Spring de tentar criar tabelas ou validar metadados (essencial!)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


# Aumenta a tolerância de espera
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10

# Garante que a conexão ainda é válida antes de usar
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.max-lifetime=1800000

# Multa padrão de R$ 5,00. TASK_FINE_SENDER_ID precisa ser um UUID existente
# na tabela users (morador responsável ou conta da casa).
tasks.fine.amount=${TASK_FINE_AMOUNT:5.00}
tasks.fine.sender-id=${TASK_FINE_SENDER_ID:}
tasks.overdue.cron=${TASK_OVERDUE_CRON:0 0 * * * *}
tasks.rotation.cron=${TASK_ROTATION_CRON:0 10 0 * * *}
